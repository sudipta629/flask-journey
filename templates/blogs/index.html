<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogs</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#4F46E5,#7C3AED);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:30px;
        }

        .container{
            width:95%;
            max-width:1100px;
            background:#fff;
            padding:35px;
            border-radius:18px;
            box-shadow:0 15px 35px rgba(0,0,0,.25);
        }

        .top-bar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:25px;
        }

        h1{
            color:#4F46E5;
            font-size:35px;
        }

        .create-btn{
            background:#16A34A;
            color:#fff;
            text-decoration:none;
            padding:12px 22px;
            border-radius:8px;
            font-weight:bold;
            transition:.3s;
        }

        .create-btn:hover{
            background:#15803D;
        }

        table{
            width:100%;
            border-collapse:collapse;
            overflow:hidden;
            border-radius:12px;
        }

        thead{
            background:#4F46E5;
            color:#fff;
        }

        th,
        td{
            padding:16px;
            text-align:left;
        }

        tbody tr{
            border-bottom:1px solid #eee;
            transition:.3s;
        }

        tbody tr:nth-child(even){
            background:#f8f8ff;
        }

        tbody tr:hover{
            background:#EEF2FF;
        }

        td{
            color:#444;
            line-height:1.6;
        }

        .content{
            max-width:450px;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }

        .empty{
            text-align:center;
            padding:30px;
            color:#777;
            font-size:18px;
        }

        @media(max-width:768px){

            .top-bar{
                flex-direction:column;
                gap:15px;
            }

            table{
                display:block;
                overflow-x:auto;
            }

        }

    </style>

</head>
<body>

<div class="container">

    <div class="top-bar">

        <h1>📝 Blogs</h1>

        <a href="{{ url_for('create_blog') }}" class="create-btn">
            ➕ Create Blog
        </a>

    </div>

    <table>

        <thead>

            <tr>
                <th>Title</th>
                <th>Content</th>
                <th>Post Date</th>
            </tr>

        </thead>

        <tbody>

        {% if blogs %}

            {% for blog in blogs %}

            <tr>

                <td>{{ blog.title }}</td>

                <td class="content">
                    {{ blog.content }}
                </td>

                <td>
                    {{ blog.date_posted.strftime("%d %b %Y") }}
                </td>

            </tr>

            {% endfor %}

        {% else %}

            <tr>

                <td colspan="3" class="empty">
                    No blogs available.
                </td>

            </tr>

        {% endif %}

        </tbody>

    </table>

</div>

</body>
</html>
