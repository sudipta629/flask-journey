<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogs</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#4F46E5,#7C3AED);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:30px;
        }

        .container{
            width:95%;
            max-width:1200px;
            background:#fff;
            padding:35px;
            border-radius:18px;
            box-shadow:0 15px 35px rgba(0,0,0,.25);
        }

        .top-bar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:25px;
        }

        h1{
            color:#4F46E5;
            font-size:35px;
        }

        .create-btn{
            background:#16A34A;
            color:#fff;
            text-decoration:none;
            padding:12px 22px;
            border-radius:8px;
            font-weight:bold;
        }

        .create-btn:hover{
            background:#15803D;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        thead{
            background:#4F46E5;
            color:white;
        }

        th,td{
            padding:15px;
            text-align:center;
            border-bottom:1px solid #eee;
        }

        tbody tr:nth-child(even){
            background:#f8f8ff;
        }

        tbody tr:hover{
            background:#EEF2FF;
        }

        .content{
            max-width:350px;
            overflow:hidden;
            white-space:nowrap;
            text-overflow:ellipsis;
        }

        .blog-image{
            width:120px;
            height:90px;
            object-fit:cover;
            border-radius:10px;
            border:2px solid #ddd;
        }

        .empty{
            text-align:center;
            font-size:18px;
            padding:30px;
        }

    </style>

</head>
<body>

<div class="container">

    <div class="top-bar">
        <h1>📝 Blogs</h1>

        <a href="{{ url_for('create_blog') }}" class="create-btn">
            ➕ Create Blog
        </a>
    </div>

    <table>

        <thead>
            <tr>
                <th>Title</th>
                <th>Content</th>
                <th>Image</th>
                <th>Post Date</th>
            </tr>
        </thead>

        <tbody>

        {% if blogs %}

            {% for blog in blogs %}

            <tr>

                <td>{{ blog.title }}</td>

                <td class="content">
                    {{ blog.content }}
                </td>

                <td>
                    {% if blog.image_file %}
                        <img class="blog-image"
                             src="{{ url_for('static', filename='images/' + blog.image_file) }}"
                             alt="{{ blog.title }}">
                    {% else %}
                        <img class="blog-image"
                             src="{{ url_for('static', filename='images/default.jpg') }}"
                             alt="Default Image">
                    {% endif %}
                </td>

                <td>
                    {{ blog.date_posted.strftime("%d %b %Y") }}
                </td>

            </tr>

            {% endfor %}

        {% else %}

            <tr>
                <td colspan="4" class="empty">
                    No blogs available.
                </td>
            </tr>

        {% endif %}

        </tbody>

    </table>

</div>

</body>
</html>
