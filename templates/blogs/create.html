<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Blog</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#4F46E5,#7C3AED);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .container{
            width:100%;
            max-width:600px;
            background:#fff;
            padding:35px;
            border-radius:18px;
            box-shadow:0 15px 35px rgba(0,0,0,.25);
        }

        h1{
            text-align:center;
            color:#4F46E5;
            margin-bottom:30px;
            font-size:32px;
        }

        label{
            display:block;
            font-weight:bold;
            margin-bottom:8px;
            color:#333;
        }

        input[type="text"],
        textarea{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            margin-bottom:20px;
            font-size:16px;
            resize:vertical;
            transition:.3s;
        }

        input[type="text"]:focus,
        textarea:focus{
            outline:none;
            border-color:#4F46E5;
            box-shadow:0 0 8px rgba(79,70,229,.3);
        }

        .btn-group{
            display:flex;
            justify-content:space-between;
            gap:15px;
            margin-top:10px;
        }

        .submit-btn{
            flex:1;
            background:#16A34A;
            color:#fff;
            border:none;
            padding:12px;
            border-radius:8px;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            transition:.3s;
        }

        .submit-btn:hover{
            background:#15803D;
        }

        .back-btn{
            flex:1;
            text-decoration:none;
            text-align:center;
            background:#4F46E5;
            color:#fff;
            padding:12px;
            border-radius:8px;
            font-weight:bold;
            transition:.3s;
        }

        .back-btn:hover{
            background:#4338CA;
        }

    </style>

</head>
<body>

<div class="container">

    <h1>📝 Create New Blog</h1>

    <form action="{{ url_for('create_blog') }}" method="POST">

        <label for="title">Title</label>
        <input
            type="text"
            id="title"
            name="title"
            placeholder="Enter blog title"
            required
        >

        <label for="content">Content</label>
        <textarea
            id="content"
            name="content"
            rows="8"
            placeholder="Write your blog content..."
            required
        ></textarea>

        <div class="btn-group">

            <input
                type="submit"
                value="Publish Blog"
                class="submit-btn"
            >

            <a href="{{ url_for('blogs') }}" class="back-btn">
                ← Back
            </a>

        </div>

    </form>

</div>

</body>
</html>
