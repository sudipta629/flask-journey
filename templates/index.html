

{%extends 'base.html'%}
{%block content%}

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}
        {% endif %}
    {% endwith %}

    <h1>Home Page</h1>

    <a href="{{ url_for('submit') }}">
        Open Form
    </a>

{%endblock%}
