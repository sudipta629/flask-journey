<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <style>

        body{
            font-family:Arial, Helvetica, sans-serif;
            background:#f5f5f5;
            text-align:center;
            padding-top:100px;
        }

        .message{
            width:350px;
            margin:auto;
            padding:15px;
            background:#d4edda;
            color:#155724;
            border:1px solid #c3e6cb;
            border-radius:6px;
            margin-bottom:20px;
        }

        a{
            text-decoration:none;
            padding:12px 25px;
            background:#007bff;
            color:white;
            border-radius:5px;
        }

    </style>

</head>
<body>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}
        {% endif %}
    {% endwith %}

    <h1>Home Page</h1>

    <a href="{{ url_for('submit') }}">
        Open Form
    </a>

</body>
</html>
