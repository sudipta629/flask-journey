<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Details</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#4F46E5,#7C3AED);
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:20px;
        }

        .card{
            width:100%;
            max-width:450px;
            background:#fff;
            border-radius:18px;
            padding:35px;
            box-shadow:0 15px 35px rgba(0,0,0,.25);
        }

        h1{
            text-align:center;
            color:#4F46E5;
            margin-bottom:25px;
        }

        .info{
            margin:18px 0;
            padding:15px;
            background:#f8f8ff;
            border-left:5px solid #4F46E5;
            border-radius:8px;
        }

        .info strong{
            color:#4F46E5;
            display:inline-block;
            width:80px;
        }

        .btn{
            display:block;
            width:100%;
            margin-top:25px;
            text-align:center;
            text-decoration:none;
            background:#4F46E5;
            color:#fff;
            padding:12px;
            border-radius:8px;
            font-weight:bold;
            transition:.3s;
        }

        .btn:hover{
            background:#4338CA;
        }

    </style>

</head>
<body>

<div class="card">

    <h1>👤 User Details</h1>

    <div class="info">
        <strong>ID :</strong> {{ user.id }}
    </div>

    <div class="info">
        <strong>Name :</strong> {{ user.name }}
    </div>

    <div class="info">
        <strong>Email :</strong> {{ user.email }}
    </div>

    <a href="{{ url_for('users') }}" class="btn">
        ← Back to Users
    </a>

</div>

</body>
</html>
