<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users List</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#4F46E5,#7C3AED);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:30px;
        }

        .container{
            width:90%;
            max-width:1000px;
            background:#fff;
            padding:35px;
            border-radius:18px;
            box-shadow:0 15px 35px rgba(0,0,0,.25);
        }

        h1{
            text-align:center;
            color:#4F46E5;
            margin-bottom:30px;
            font-size:35px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            border-radius:12px;
            overflow:hidden;
        }

        thead{
            background:#4F46E5;
            color:#fff;
        }

        th,
        td{
            padding:16px;
            text-align:center;
        }

        tbody tr{
            border-bottom:1px solid #eee;
            transition:.3s;
        }

        tbody tr:nth-child(even){
            background:#f8f8ff;
        }

        tbody tr:hover{
            background:#EEF2FF;
        }

        .action{
            display:flex;
            justify-content:center;
            gap:10px;
        }

        .edit-btn{
            background:#2563EB;
            color:#fff;
            text-decoration:none;
            padding:10px 18px;
            border-radius:8px;
            font-weight:bold;
            transition:.3s;
        }

        .edit-btn:hover{
            background:#1D4ED8;
        }

        .delete-form{
            display:inline;
            margin:0;
        }

        .delete-btn{
            background:#DC2626;
            color:white;
            border:none;
            padding:10px 18px;
            border-radius:8px;
            font-weight:bold;
            cursor:pointer;
            transition:.3s;
        }

        .delete-btn:hover{
            background:#B91C1C;
        }

        .empty{
            text-align:center;
            padding:25px;
            color:#666;
            font-size:18px;
        }
        .top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.new-btn{
    background:#16A34A;
    color:#fff;
    text-decoration:none;
    padding:12px 22px;
    border-radius:8px;
    font-weight:bold;
    transition:.3s;
    display:inline-block;
}

.new-btn:hover{
    background:#15803D;
    transform:translateY(-2px);
}

    </style>

</head>
<body>

<div class="container">

    <h1>👥 Users List</h1>
    <div class="top-bar">

    <h1>👥 Users List</h1>

    <a href="{{ url_for('new_users') }}" class="new-btn">
        ➕ New User
    </a>

</div>
    <table>

        <thead>

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Actions</th>
        </tr>

        </thead>

        <tbody>

        {% if users %}

            {% for user in users %}

            <tr>

                <td>{{ user.id }}</td>
                <td>{{ user.name }}</td>
                <td>{{ user.email }}</td>

                <td>

                    <div class="action">

                        <a href="{{ url_for('edit_user', id=user.id) }}"
                           class="edit-btn">
                            ✏️ Edit
                        </a>

                        <a href="{{ url_for('show_user', id=user.id) }}"
                           class="edit-btn">
                            👁️ Show
                        </a>


                        <form action="{{ url_for('delete_user', id=user.id) }}"
                              method="POST"
                              class="delete-form"
                              onsubmit="return confirm('Are you sure you want to delete this user?');">

                            <button type="submit"
                                    class="delete-btn">
                                🗑 Delete
                            </button>

                        </form>

                    </div>

                </td>

            </tr>

            {% endfor %}

        {% else %}

            <tr>

                <td colspan="4" class="empty">
                    No users found.
                </td>

            </tr>

        {% endif %}

        </tbody>

    </table>

</div>

</body>
</html>
