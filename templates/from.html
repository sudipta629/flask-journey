<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask-WTF Form</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#4F46E5,#7C3AED);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:400px;
            background:#fff;
            padding:35px;
            border-radius:15px;
            box-shadow:0 15px 30px rgba(0,0,0,.25);
        }

        h1{
            text-align:center;
            color:#333;
            margin-bottom:25px;
        }

        label{
            font-weight:bold;
            color:#444;
            display:block;
            margin-bottom:8px;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
            margin-bottom:20px;
            outline:none;
            transition:.3s;
        }

        input:focus{
            border-color:#4F46E5;
            box-shadow:0 0 8px rgba(79,70,229,.3);
        }

        input[type="submit"]{
            background:#4F46E5;
            color:white;
            border:none;
            cursor:pointer;
            font-size:17px;
            font-weight:bold;
        }

        input[type="submit"]:hover{
            background:#4338CA;
        }

    </style>

</head>
<body>

<div class="container">

    <h1>Flask-WTF Form</h1>

    <form method="POST">

        {{ form.hidden_tag() }}

        <label>{{ form.name.label }}</label>
        {{ form.name() }}

        <label>{{ form.email.label }}</label>
        {{ form.email() }}

        {{ form.submit() }}

    </form>

</div>

</body>
</html>
